<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>مترجم زنده</title>
<style>
  :root { --bg:#f3f5f7; --fg:#12202b; --muted:#5c6b77; --card:#ffffff; --accent:#0a6c74; --danger:#b3261e; --line:#d5dce1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10181e; --fg:#e8eef2; --muted:#93a3ae; --card:#18232b; --accent:#4cc2cb; --danger:#ff8a80; --line:#2b3a44; }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:"Vazirmatn","Noto Naskh Arabic",Tahoma,sans-serif; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  input,select,button { font:inherit; font-size:16px; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  input { flex:1 1 220px; direction:ltr; }
  button { background:var(--accent); color:var(--bg); border:none; font-weight:700; min-width:90px; }
  button.stop { background:var(--danger); }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); min-width:0; }
  #status { padding:6px 16px; color:var(--muted); font-size:14px; }
  #out { flex:1; overflow-y:auto; padding:16px; font-size:30px; line-height:1.9; }
  #out p { margin:0 0 14px; }
  #out p.live { color:var(--accent); }
  #out p.old { color:var(--muted); font-size:22px; }
  .err { color:var(--danger); }
</style>
</head>
<body>
<header>
  <input id="key" type="password" placeholder="کلید API جمینی" autocomplete="off">
  <select id="lang">
    <option value="Persian">ترجمه به فارسی</option>
    <option value="English">ترجمه به انگلیسی</option>
    <option value="Turkish">ترجمه به ترکی</option>
  </select>
  <button id="btn">شروع</button>
  <button id="clr" class="ghost">پاک کردن</button>
</header>
<div id="status">آماده. صدا باید از بلندگوی آیپد پخش شود، نه هدفون.</div>
<div id="out"></div>

<script>
const MODEL = "models/gemini-live-2.5-flash-preview"; // اگر کار نکرد، نام را از مستندات Google چک کنید
const $ = id => document.getElementById(id);
let ws, ctx, stream, node, running = false, curP = null;

try { $("key").value = localStorage.getItem("gk") || ""; } catch(e) {}

function setStatus(t, isErr) { $("status").textContent = t; $("status").className = isErr ? "err" : ""; }

// Worklet: float32 -> int16 PCM, buffered ~100ms
const workletCode = `
class P extends AudioWorkletProcessor {
  constructor(){ super(); this.buf = []; this.n = 0; }
  process(inputs){
    const ch = inputs[0][0];
    if (!ch) return true;
    this.buf.push(new Float32Array(ch)); this.n += ch.length;
    if (this.n >= 1600) {
      const all = new Float32Array(this.n); let o = 0;
      for (const b of this.buf){ all.set(b, o); o += b.length; }
      const pcm = new Int16Array(all.length);
      for (let i=0;i<all.length;i++){ const s = Math.max(-1, Math.min(1, all[i])); pcm[i] = s < 0 ? s*0x8000 : s*0x7FFF; }
      this.port.postMessage(pcm.buffer, [pcm.buffer]);
      this.buf = []; this.n = 0;
    }
    return true;
  }
}
registerProcessor("pcm-processor", P);`;

function b64(buf) {
  const bytes = new Uint8Array(buf); let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

function newPara() {
  if (curP) curP.className = "old";
  curP = document.createElement("p"); curP.className = "live";
  $("out").appendChild(curP);
}
function addText(t) {
  if (!curP) newPara();
  curP.textContent += t;
  $("out").scrollTop = $("out").scrollHeight;
}

async function start() {
  const key = $("key").value.trim();
  if (!key) return setStatus("ابتدا کلید API را وارد کنید.", true);
  try { localStorage.setItem("gk", key); } catch(e) {}

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    });
  } catch (e) { return setStatus("دسترسی میکروفون داده نشد: " + e.message, true); }

  setStatus("در حال اتصال...");
  ws = new WebSocket("wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + encodeURIComponent(key));

  ws.onopen = () => ws.send(JSON.stringify({ setup: {
    model: MODEL,
    generationConfig: { responseModalities: ["TEXT"] },
    systemInstruction: { parts: [{ text:
      "You are a live simultaneous interpreter. Translate everything you hear into " + $("lang").value +
      ". Output only the translation, no comments, no notes. If the audio is silence or music, output nothing." }] }
  }}));

  ws.onmessage = async e => {
    let raw = e.data instanceof Blob ? await e.data.text() : e.data;
    let msg; try { msg = JSON.parse(raw); } catch { return; }
    if (msg.setupComplete) { setStatus("در حال گوش دادن... ویدیو را پخش کنید."); await startAudio(); return; }
    const parts = msg.serverContent?.modelTurn?.parts;
    if (parts) for (const p of parts) if (p.text) addText(p.text);
    if (msg.serverContent?.turnComplete) newPara();
  };
  ws.onerror = () => setStatus("خطای اتصال. کلید یا نام مدل را بررسی کنید.", true);
  ws.onclose = ev => { if (running) { setStatus("اتصال بسته شد: " + (ev.reason || ev.code), true); stop(true); } };

  running = true;
  $("btn").textContent = "توقف"; $("btn").className = "stop";
}

async function startAudio() {
  ctx = new AudioContext({ sampleRate: 16000 });
  const url = URL.createObjectURL(new Blob([workletCode], { type:"application/javascript" }));
  await ctx.audioWorklet.addModule(url);
  const src = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, "pcm-processor");
  node.port.onmessage = ev => {
    if (ws?.readyState === 1) ws.send(JSON.stringify({ realtimeInput: { mediaChunks: [{ mimeType:"audio/pcm;rate=16000", data:b64(ev.data) }] } }));
  };
  src.connect(node);
  if (ctx.state === "suspended") await ctx.resume();
}

function stop(keepMsg) {
  running = false;
  try { ws?.close(); } catch(e) {}
  try { node?.disconnect(); } catch(e) {}
  try { stream?.getTracks().forEach(t => t.stop()); } catch(e) {}
  try { ctx?.close(); } catch(e) {}
  $("btn").textContent = "شروع"; $("btn").className = "";
  if (!keepMsg) setStatus("متوقف شد.");
}

$("btn").onclick = () => running ? stop() : start();
$("clr").onclick = () => { $("out").innerHTML = ""; curP = null; };
</script>
</body>
</html>
